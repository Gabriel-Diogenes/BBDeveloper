spring.application.name=BBDeveloper

# Credenciais: copie application-secrets.properties.example para application-secrets.properties
# Em producao no servidor: use variaveis de ambiente ou config externa (deploy/config/)
spring.config.import=optional:classpath:application-secrets.properties,optional:file:./application-secrets.properties,optional:file:./config/application-secrets.properties

# Homologacao: java -jar app.jar --spring.profiles.active=homologacao
# Producao:    java -jar app.jar --spring.profiles.active=producao
spring.profiles.active=homologacao

bb.scope=pix.read pix.write cob.write cobv.write cob.read cobv.read cobrancas.boletos-info cobrancas.boletos-requisicao extrato-info
