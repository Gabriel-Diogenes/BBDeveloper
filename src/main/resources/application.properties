spring.application.name=BBDeveloper

# Homologacao: java -jar app.jar --spring.profiles.active=homologacao
# Producao:    java -jar app.jar --spring.profiles.active=producao
spring.profiles.active=producao

bb.scope=pix.read pix.write cob.write cobv.write cob.read cobv.read cobrancas.boletos-info cobrancas.boletos-requisicao extrato-info

# =============================================================================
# CREDENCIAIS HOMOLOGACAO (portal BB Developers -> Credenciais -> Teste)
# =============================================================================
bb.homolog.client-id=
bb.homolog.client-secret=
bb.homolog.developer-key=
bb.homolog.ssl-cert-path=
bb.homolog.ssl-cert-password=
bb.homolog.pix-key=

# =============================================================================
# CREDENCIAIS PRODUCAO (portal BB Developers -> Credenciais -> Producao)
# =============================================================================
bb.producao.client-id=
bb.producao.client-secret=
bb.producao.developer-key=
bb.producao.ssl-cert-path=
bb.producao.ssl-cert-password=
bb.producao.pix-key=
